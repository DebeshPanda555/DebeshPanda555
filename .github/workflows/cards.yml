name: Refresh profile cards

on:
  schedule:
    - cron: "30 0 * * *" # daily, 00:30 UTC (06:00 IST)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - render_cards.py
      - scripts/fetch_data.py
      - fonts/**
      - assets/**

permissions:
  contents: write

# Never run two refreshes at once; they would both try to push.
concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # fonttools provides pyftsubset, which subsets Inter into each card.
      # Pillow is optional: it shrinks assets/portrait.* if you add one.
      - name: Install dependencies
        run: pip install fonttools pillow

      # Add a PROFILE_TOKEN secret (classic PAT, read:user) to include private contributions.
      - name: Refresh contribution data
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_data.py

      - name: Render cards
        run: python render_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards data
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore(cards): refresh profile cards"
          git pull --rebase
          git push
