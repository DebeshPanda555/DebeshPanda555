<svg xmlns="http://www.w3.org/2000/svg" width="900" height="217" viewBox="0 0 900 217" role="img" aria-labelledby="t d">
<title id="t">DoodleVerse: Real-time collaborative canvas in Go: low-latency state sync, graceful reconnects and per-session rate limiting.</title><desc id="d">DoodleVerse (DebeshPanda555/DoodleVerse). Real-time collaborative canvas in Go: low-latency state sync, graceful reconnects and per-session rate limiting. Stack: Go, WebSockets, React.</desc>
<style><![CDATA[
@font-face{font-family:'InterCard';font-style:normal;font-weight:400;src:url(data:font/woff;base64,) format('woff')}
